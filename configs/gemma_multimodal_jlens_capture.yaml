# Multimodal J-lens capture on Gemma 4 E4B — the first image-conditioned and
# audio-conditioned records for the explorer. Applies the FROZEN, text-fitted
# pilot lens to multimodal-conditioned decoder states: an exploratory probe,
# recorded as such (no modality-invariance claim). Validated by
# jlens.metadata.load_multimodal_config; run by
# notebooks/gemma_4_e4b_multimodal_jlens_capture.ipynb.
mode: multimodal_capture

model:
  repo_id: google/gemma-4-E4B-it
  revision: fa62d88df2e6df5efa9d26ad6b3beaea2765f0cd  # immutable, same as lens fit
  dtype: bfloat16
  device_map: null            # notebook overrides to "cuda" via JLENS_DEVICE_MAP
  allow_model_load: false     # notebook overrides via JLENS_ALLOW_GEMMA=1 (recorded)
  expect_n_layers: 42
  expect_d_model: 2560
  expect_vocab_size: 262144

lens:
  run_dir_name: pilot_20260715T200437612150_311fd108c23a
  artifact_relpath: artifacts/lens.pt
  expect_file_sha256: sha256:7229c7562d1d55420b70abb13f481934649c4b01417bd851e97cedb47c96f474
  expect_model_revision: fa62d88df2e6df5efa9d26ad6b3beaea2765f0cd
  expect_source_layers: [3, 7, 14, 21, 28, 35, 38]
  expect_n_prompts: 100

capture:
  layers: [38]                # start with 38; add 35 only after 38 succeeds
  k: 10
  position: -1                # final text-generation position
  top_k: 10

decomposition:
  # Identical settings to the completed jspace run so text and multimodal
  # cones are directly comparable.
  normalize_atoms: true
  refine_steps: 2
  tol_relative_residual: 0.0
  fold_final_norm_weight: false
  correlation_chunk_size: 65536

inputs:
  # Set these in the notebook's INPUTS cell (or here). Paths are user-supplied
  # at run time — no sample assets are committed to the repository.
  image_path: null            # e.g. /content/drive/MyDrive/jacobian-lens-gemma/inputs/photo.jpg
  image_prompt: "Describe this image in one word. The main subject of the image is"
  audio_path: null            # e.g. /content/drive/MyDrive/jacobian-lens-gemma/inputs/clip.wav
  audio_prompt: "Describe this sound in one word. The sound is a"

paths:
  output_dir: artifacts/multimodal_capture   # local light-path output; Colab uses RUN_DIR/artifacts
