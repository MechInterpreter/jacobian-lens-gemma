# Generative J-cone steering validation on Gemma 4 E4B — can weighted
# reconstructions of active J-space generators, injected into a neutral
# verbalization prompt, make the model's own autoregressive decoder produce
# the multi-token concept? Consumes the frozen pilot lens; runs a fresh k=10
# pursuit per benchmark example (the existing cone records cover the eval-v2
# prompts, not this benchmark). Validated by
# jlens.metadata.load_generative_config; run by
# scripts/run_generative_validation.py.
mode: generative_validation

model:
  repo_id: google/gemma-4-E4B-it
  revision: fa62d88df2e6df5efa9d26ad6b3beaea2765f0cd  # immutable, same as lens fit
  dtype: bfloat16
  device_map: null            # runner overrides to "cuda" via JLENS_DEVICE_MAP
  allow_model_load: false     # runner overrides via JLENS_ALLOW_GEMMA=1 (recorded)
  expect_n_layers: 42
  expect_d_model: 2560
  expect_vocab_size: 262144

lens:
  run_dir_name: pilot_20260715T200437612150_311fd108c23a
  artifact_relpath: artifacts/lens.pt
  expect_file_sha256: sha256:7229c7562d1d55420b70abb13f481934649c4b01417bd851e97cedb47c96f474
  expect_model_revision: fa62d88df2e6df5efa9d26ad6b3beaea2765f0cd
  expect_source_layers: [3, 7, 14, 21, 28, 35, 38]
  expect_n_prompts: 100

benchmark:
  manifest_path: configs/generative_benchmark.json
  split: dev                  # heldout only after calibration is frozen
  # Every main-benchmark target must tokenize to this many tokens under the
  # pinned tokenizer, checked after the model loads (the count is a property of
  # the checkpoint vocabulary, not of the manifest). A single-token target tests
  # no multi-token scoring and forces prompt_only/constant/decaying to identical
  # target log-probabilities; the run aborts rather than record that silently.
  target_token_bounds:
    min: 2
    max: 6

pursuit:
  k: 10
  normalize_atoms: true
  refine_steps: 2
  tol_relative_residual: 0.0
  correlation_chunk_size: 65536
  atoms_dtype: float32

steering:
  # Workspace-region layers (normalized depth of 42 blocks): early-middle,
  # middle, late-middle — all fitted in the pilot lens. Finer sweeps only
  # after a specific signal appears.
  layers: [14, 21, 28]
  # Requested perturbation-to-activation norm ratios; both requested and
  # measured ratios are recorded per condition.
  #
  # Weighted J-cone reconstructions are intrinsically small relative to the
  # receiving residual (layer-21 pilot cones explain ~1e-5 of it), so the
  # informative region is *low*: 0.01-0.25 brackets the natural cone scale that
  # the `natural_scale` condition measures directly. Ratios >= 0.5 are retained
  # only as stress tests — at that magnitude the injection dominates the
  # residual, so an effect there says little about whether the cone means
  # anything, and a *failure* there is not evidence against the hypothesis.
  strength_ratios: [0.01, 0.03, 0.05, 0.1, 0.25, 0.5, 1.0, 2.0]
  schedules:
    - kind: prompt_only
    - kind: constant
    - kind: decaying
      decay: 0.5
  mass_thresholds: [0.6, 0.7, 0.8]
  # Site controls: wrong_layer uses the farthest other fitted steering layer;
  # wrong_position anchors at this absolute position (1 = first post-BOS
  # token of the neutral prompt).
  wrong_position_anchor: 1
  conditions:
    - none
    - zero
    - full_cone
    # The cone at its own norm, unscaled: records where the reconstruction
    # naturally sits relative to the receiving activation (`natural_ratio`) and
    # what it does there, independent of any chosen ratio.
    - natural_scale
    - mass_subcone
    - unrelated_cone
    - random_matched_norm
    - shuffled
    - sign_reversed
    - wrong_layer
    - wrong_position
    - raw_activation
    - activation_diff
    # Matched natural-scale controls: the direction of each control above,
    # rescaled to natural_scale's own injected delta norm (not to a ratio of
    # the receiving activation) and run across every schedule natural_scale
    # supports. Ratio-scaled controls alone are evaluated at a different norm
    # than natural_scale, so they cannot show whether a low-strength gain is
    # specific to the correct cone's *direction* rather than to injection
    # magnitude or schedule choice; these can. See
    # jlens.generative.NATURAL_SCALE_MATCHED_CONDITIONS and
    # docs/generative_validation.md.
    - natural_unrelated_cone
    - natural_random_matched_norm
    - natural_shuffled
    - natural_sign_reversed
    - natural_mass_subcone
  # manual_subcone joins the list automatically for examples whose manifest
  # entry provides indices; it is never fabricated.

decode:
  generate: true
  max_new_tokens: 12
  # Uncached decoding is the dominant cost; restrict generation to these
  # strength ratios and schedule kinds (scoring covers the full sweep). Weighted
  # toward the informative low end, with 1.0 kept as a stress point.
  # natural_scale and every natural-scale-matched control carry ratio=null and
  # always decode (their schedule loop covers all configured schedules, not
  # just schedule_kinds above).
  ratios: [0.05, 0.1, 0.25, 1.0]
  schedule_kinds: [prompt_only, constant]
  # Decoding is expensive uncached; restrict full-battery generation to these
  # conditions (scoring always covers every condition). Mirrors the base
  # conditions' inclusion/exclusion: natural_unrelated_cone /
  # natural_random_matched_norm / natural_mass_subcone decode because
  # unrelated_cone / random_matched_norm / mass_subcone do; natural_shuffled /
  # natural_sign_reversed do not, because shuffled / sign_reversed don't.
  generate_conditions:
    - none
    - zero
    - full_cone
    - natural_scale
    - mass_subcone
    - manual_subcone
    - unrelated_cone
    - random_matched_norm
    - raw_activation
    - natural_unrelated_cone
    - natural_random_matched_norm
    - natural_mass_subcone

# How the receiver (neutral) prompt is presented to the model. The pinned
# checkpoint is instruction-tuned (google/gemma-4-E4B-it), so `chat` — one user
# message through the tokenizer's own chat template, with the model-generation
# prefix — is the only formatting it was tuned to answer. `legacy_raw`
# reproduces the earlier raw-text encoding and exists only for reproducing
# those (confounded) runs. Source prompts are unaffected by this setting.
receiver:
  format: chat

# Default receiver prompts: target-independent and free of the priming
# vocabulary (internal / representation / concept / label / value) that made
# the model's most likely continuation a restatement of the prompt itself —
# the origin of the "Internal Concept" decodes. The old prompts survive as
# jlens.generative.LEGACY_DIAGNOSTIC_PROMPTS (legacy-label-colon,
# legacy-answer-four-words, legacy-shortest-label-is) for diagnostics only.
neutral_prompts: [noun-phrase-only, what-is-described, name-the-entity]

eval:
  control_seed: 1234

parity:
  # Zero-delta logit parity: a zero steering vector must reproduce baseline
  # logits. Same path on both sides, so this is a near-exact check.
  max_abs_logit_diff_tol: 0.05
  # Greedy-equivalence gate (manual uncached decode vs a determinized
  # generate()). Token equality is asserted unconditionally; these bound the
  # first-step distributions. Deliberately NOT a max over the 262k vocabulary:
  # log_softmax turns a fixed logit perturbation into a similar log-prob gap at
  # every token, so that statistic is reported by tokens with ~1e-13 probability
  # and sits at the bfloat16 quantization floor (one ULP near Gemma's |logit|=30
  # softcap bound is already 0.0625). It is recorded as a diagnostic instead.
  greedy_top_k: 10
  # Worst log-prob gap over the union of both sides' top-k — the only tokens a
  # greedy decode or a target score can be sensitive to.
  max_abs_logprob_diff_topk_tol: 0.05
  # 0.5 * sum |p_a - p_b| over the full vocabulary: one bounded whole-
  # distribution number that no single tail outlier can dominate.
  max_total_variation_tol: 0.02

paths:
  output_dir: artifacts/generative_validation
